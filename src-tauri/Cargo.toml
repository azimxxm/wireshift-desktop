[package]
name = "wireshift"
version = "1.0.1"
edition = "2021"
description = "WireShift — High-Speed iPhone Migration & Diagnostics Desktop Application"
authors = ["Azimjon Dev <uz.azimjondev.wireshift>"]
license = "Proprietary"

[lib]
name = "wireshift_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"

tokio = { version = "1.40", features = ["full"] }
tokio-stream = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
thiserror = "1.0"
regex = "1.10"
base64 = "0.22"
tracing = "0.1"
tracing-subscriber = "0.3"
